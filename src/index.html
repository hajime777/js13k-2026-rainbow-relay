<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rainbow Sky Cleaner Prototype v4.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Yu Gothic UI",sans-serif;background:#cfd6df;color:#5d6072}body{display:flex;align-items:center;justify-content:center}.game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:16px;box-shadow:0 10px 30px rgba(85,98,130,.13);padding:9px 12px;backdrop-filter:blur(5px)}.title{font-size:18px;font-weight:800;color:#69648a}.sub{font-size:11px;margin-top:2px;line-height:1.35}.meterBox{width:260px}.game .hud{flex-direction:column}.game .meterBox{width:auto}.row{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px}.meter{height:10px;border-radius:99px;background:#e1e3ed;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#f5a3b8,#f8c398,#f5df93,#a9dca7,#9fd4ee,#b7b7ed,#d8b4e8);transition:width .12s}.small{font-size:9px;line-height:1.3;opacity:.82;margin-top:4px}.bottom{position:absolute;left:18px;right:18px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.msg{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:999px;padding:10px 15px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(85,98,130,.12)}button{pointer-events:auto;border:0;border-radius:999px;padding:11px 17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e9a8c2,#8ecae7);box-shadow:0 7px 20px rgba(94,162,195,.25);cursor:pointer}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:24px 30px;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.92);border-radius:30px;box-shadow:0 14px 36px rgba(85,98,130,.15);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}.toast.show{opacity:1}.toast .big{font-size:28px;font-weight:900;color:#6e6a94}.toast .smalltxt{font-size:14px;margin-top:8px;line-height:1.6}@media(max-width:720px){.hud{flex-direction:column}.meterBox{width:auto}.sub{max-width:82vw}.bottom{align-items:flex-end}.msg{border-radius:16px;max-width:72vw}}
</style>
</head>
<body>
<div id="game" class="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="box"><div class="title">Rainbow Sky Cleaner</div><div class="sub">虹は曇り空の向こうに、最初から隠れています。<br>画面をこすって曇りをお掃除し、青空と虹を見つけてください。<br>雲は少し残っていても大丈夫です。</div></div>
  <div class="box meterBox"><div class="row"><span>Rainbow Revealed</span><span id="pct">0%</span></div><div class="meter"><div id="fill" class="fill"></div></div><div class="small">虹が90%見えたらクリアです。雲を全部消す必要はありません。</div></div>
</div>
<div class="bottom"><div id="msg" class="msg">灰色の空をなぞってみてください。虹のある場所なら、その部分だけ現れます。</div><button id="reset">Restart</button></div>
<div id="toast" class="toast"><div class="big">Rainbow Found!</div><div class="smalltxt">十分に虹が見えました。<br>雲が少し残っていてもクリアです。</div></div>
</div>
<script src="./logic.js"></script>
<script>
(()=>{
const {distancePointToSegment,revealPercent,isClearedPercent,markRevealPoints,rainbowPoint}=RainbowLogic;
const c=document.querySelector('#c'),x=c.getContext('2d'),pct=document.querySelector('#pct'),fill=document.querySelector('#fill'),msg=document.querySelector('#msg'),toast=document.querySelector('#toast');
const cleanCanvas=document.createElement('canvas'),cleanCtx=cleanCanvas.getContext('2d');
const maskCanvas=document.createElement('canvas'),maskCtx=maskCanvas.getContext('2d');
const revealCanvas=document.createElement('canvas'),revealCtx=revealCanvas.getContext('2d');
const C=['#f3a4b8','#f6bb91','#f1d97d','#a8d69f','#92cce8','#abaee8','#d4afe4'];
let W=0,H=0,D=1,SW=0,CX=0,cropSide=1,clouds=[],rain=[],down=0,last=null,t=0,mouse={x:-99,y:-99},revealed=0,points=[],rainbow=null,cleared=0,stage=1,nextTimer=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){D=Math.min(1.5,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);for(const q of [cleanCanvas,maskCanvas,revealCanvas]){q.width=Math.floor(W*D);q.height=Math.floor(H*D)}cleanCtx.setTransform(D,0,0,D,0,0);maskCtx.setTransform(D,0,0,D,0,0);revealCtx.setTransform(D,0,0,D,0,0);reset()}
function reset(next=0){clearTimeout(nextTimer);nextTimer=0;if(next)stage++;clouds=[];rain=[];revealed=0;down=0;last=null;cleared=0;cropSide=Math.random()<.5?-1:1;SW=H*16/9;CX=cropSide<0?0:Math.max(0,SW-W);toast.classList.remove('show');maskCtx.save();maskCtx.setTransform(1,0,0,1,0,0);maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);maskCtx.restore();
 const cols=Math.max(6,Math.floor(W/105)),rows=Math.max(5,Math.floor(H/135));
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let cx=(i+.5)*W/cols+rnd(-45,45),cy=115+(j+.45)*(H*.64-70)/rows+rnd(-28,28),s=rnd(38,64);clouds.push({x:cx,y:cy,s,d:1,p:rnd(0,6.28),vx:0,vy:0});if(Math.random()<.68)clouds.push({x:cx+rnd(-55,55),y:cy+rnd(-20,20),s:s*rnd(.62,.84),d:1,p:rnd(0,6.28),vx:0,vy:0})}
 for(let i=0;i<Math.max(40,W*H/22000);i++)rain.push({x:Math.random()*W,y:Math.random()*H,l:rnd(7,15),v:rnd(110,210)});
 buildRainbowPoints();prepareStaticScene();rebuildReveal();updateMeter()}
function buildRainbowPoints(){points=[];rainbow={cx:SW*.5-CX,cy:H*.92,base:Math.min(SW*.43,H*.72),band:Math.max(8,Math.min(15,SW/90)),a0:Math.PI*1.06,a1:Math.PI*1.94};
 const count=84;
 for(let i=0;i<count;i++){
   let u=i/(count-1),p=rainbowPoint(stage,u,rainbow,rainbow.band*3);
   if(p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H)points.push({x:p.x,y:p.y,hit:0});
 }
}
function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scrub(a,b){let dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)return;let nx=dx/L,ny=dy/L;
 maskCtx.save();maskCtx.lineCap='round';maskCtx.lineJoin='round';
 maskCtx.strokeStyle='rgba(255,255,255,.20)';maskCtx.lineWidth=98;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();
 maskCtx.strokeStyle='rgba(255,255,255,.62)';maskCtx.lineWidth=78;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();
 maskCtx.strokeStyle='#fff';maskCtx.lineWidth=54;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();maskCtx.restore();
 for(const q of clouds){let d=distancePointToSegment(q.x,q.y,a,b),r=q.s+44;if(d<r){let f=1-d/r,push=Math.min(190,55+L*5)*f;q.d=Math.max(.18,q.d-(.02+f*.05));q.vx=Math.max(-260,Math.min(260,q.vx+nx*push));q.vy=Math.max(-260,Math.min(260,q.vy+ny*push))}}
 markReveal(a,b,52);rebuildReveal();updateMeter()}
function markReveal(a,b,r){revealed+=markRevealPoints(points,a,b,r)}
function updateMeter(){let p=revealPercent(revealed,points.length);pct.textContent=p+'%';fill.style.width=p+'%';
 if(p<8)msg.textContent=stage===1?'灰色の空をなぞってみてください。虹のある場所なら、その部分だけ現れます。':'Stage '+stage+'：今度の虹は少し変です。雲の向こうに続きを探してください。';
 else if(p<22)msg.textContent='そうです。こすった場所だけ、曇りの向こうの青空が見えてきます。';
 else if(p<45)msg.textContent='いい感じです。見えている虹の続きをたどってみてください。';
 else if(!isClearedPercent(p))msg.textContent='もう少しです。見えていない虹の続きがないか探してみてください。';
 else if(!cleared){cleared=1;msg.textContent='虹を90%見つけました。次の空へ進みます。';toast.classList.add('show');nextTimer=setTimeout(()=>reset(1),2000)}
}
function drawCleanScene(g){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd8f4');sky.addColorStop(.58,'#c8eafd');sky.addColorStop(1,'#ecf7ff');g.fillStyle=sky;g.fillRect(0,0,W,H);
 let sx=SW*.82-CX,sy=H*.18,rg=g.createRadialGradient(sx,sy,0,sx,sy,150);rg.addColorStop(0,'rgba(255,249,206,.72)');rg.addColorStop(1,'rgba(255,249,206,0)');g.fillStyle=rg;g.beginPath();g.arc(sx,sy,150,0,7);g.fill();
 let cx=SW*.5-CX,cy=H*.92,base=Math.min(SW*.43,H*.72),band=Math.max(8,Math.min(15,SW/90));rainbow={cx,cy,base,band,a0:Math.PI*1.06,a1:Math.PI*1.94};g.save();g.lineCap='round';g.lineJoin='round';for(let i=0;i<7;i++){g.strokeStyle=C[i];g.globalAlpha=.88;g.lineWidth=band;g.beginPath();if(stage===1)g.arc(cx,cy,base-i*band*.92,rainbow.a0,rainbow.a1);else for(let j=0;j<=72;j++){let p=rainbowPoint(stage,j/72,rainbow,i*band*.92);j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke()}g.restore();
 g.save();g.translate(-CX,0);g.fillStyle='#d9efda';g.beginPath();g.moveTo(0,H);g.bezierCurveTo(SW*.17,H*.80,SW*.35,H*.91,SW*.52,H*.84);g.bezierCurveTo(SW*.73,H*.72,SW*.88,H*.92,SW,H*.82);g.lineTo(SW,H);g.fill();g.restore();}
function drawDirtyBase(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c3c8d5');g.addColorStop(.56,'#cbd2dc');g.addColorStop(1,'#d8dfe3');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(148,155,171,.12)';x.fillRect(0,0,W,H);
 x.save();x.translate(-CX,0);x.fillStyle='#cbd8cf';x.beginPath();x.moveTo(0,H);x.bezierCurveTo(SW*.17,H*.80,SW*.35,H*.91,SW*.52,H*.84);x.bezierCurveTo(SW*.73,H*.72,SW*.88,H*.92,SW,H*.82);x.lineTo(SW,H);x.fill();x.restore();}
function drawRain(){x.strokeStyle='rgba(90,105,129,.20)';x.lineWidth=1.3;x.beginPath();for(const r of rain){x.moveTo(r.x,r.y);x.lineTo(r.x-3,r.y+r.l)}x.stroke()}
function parts(g,cx,cy,s,fill){const P=[[-.68,.14,.45],[-.43,-.13,.54],[-.12,-.30,.65],[.22,-.22,.58],[.53,.02,.49],[.08,.19,.80]];g.beginPath();for(const p of P){g.moveTo(cx+p[0]*s+p[2]*s,cy+p[1]*s);g.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,6.283)}g.fillStyle=fill;g.fill()}
function drawClouds(){for(const q of clouds){let ox=Math.sin(t*.55+q.p)*2,oy=Math.cos(t*.47+q.p)*1.2,cx=q.x+ox,cy=q.y+oy,s=q.s;parts(x,cx+4,cy+6,s,'rgba(93,101,122,'+(.10+.08*q.d)+')');parts(x,cx,cy,s,'rgba(245,246,249,'+(.26*(1-q.d))+')');parts(x,cx,cy,s,'rgba(154,161,178,'+(.78*q.d)+')')}}
function prepareStaticScene(){cleanCtx.clearRect(0,0,W,H);drawCleanScene(cleanCtx)}
function rebuildReveal(){revealCtx.clearRect(0,0,W,H);revealCtx.globalCompositeOperation='source-over';revealCtx.drawImage(cleanCanvas,0,0,W,H);revealCtx.globalCompositeOperation='destination-in';revealCtx.drawImage(maskCanvas,0,0,W,H);revealCtx.globalCompositeOperation='source-over'}
function cursor(){if(mouse.x<0)return;x.save();x.strokeStyle='rgba(255,255,255,.72)';x.lineWidth=2;x.setLineDash([4,5]);x.beginPath();x.arc(mouse.x,mouse.y,28,0,7);x.stroke();x.restore()}
function update(dt){t+=dt;let damp=Math.pow(.1,dt);for(const q of clouds){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=damp;q.vy*=damp}for(const r of rain){r.y+=r.v*dt;r.x-=15*dt;if(r.y>H+20){r.y=rnd(-100,-10);r.x=Math.random()*W}}}
function draw(){drawDirtyBase();drawRain();x.drawImage(revealCanvas,0,0,W,H);drawClouds();cursor()}
let prev=performance.now();function loop(n){let dt=Math.min(.033,(n-prev)/1000);prev=n;update(dt);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{down=1;last=point(e);mouse=last;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{mouse=point(e);if(!down)return;let p=mouse;scrub(last,p);last=p});function up(e){down=0;last=null;try{c.releasePointerCapture(e.pointerId)}catch{}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',()=>mouse={x:-99,y:-99});document.querySelector('#reset').onclick=()=>{stage=1;reset()};addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
