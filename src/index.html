function startAudio(){if(audioOn){ac.resume();return}audioOn=1;ac=new (AudioContext||webkitAudioContext)();let b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++){let e=Math.min(1,i/2048,(a.length-1-i)/2048);a[i]=(Math.random()*2-1)*.55*e}let s=ac.createBufferSource(),f=ac.createBiquadFilter();rainGain=ac.createGain();s.buffer=b;s.loop=1;f.type='bandpass';f.frequency.value=3800;f.Q.value=.7;rainGain.gain.value=0;s.connect(f).connect(rainGain).connect(ac.destination);s.start();let seq=[0,2,4,-99,4,2,0,-99,2,4,5,-99,7,5,4,-99],i=0,step=60/138/2,next=ac.currentTime+.05;function tick(){let now=ac.currentTime;if(next<now-.2)next=now+.05;while(next<now+.15){let j=i++&15,n=seq[j],k=seedUnit(baseSeed,9201)<.5?0:2;if(!overview&&!goal&&!timeUp&&n>-50){if(j===6&&seedUnit(baseSeed,9202)>.5)n=2;if(j===13&&seedUnit(baseSeed,9203)>.5)n=7;let w=next-now;tone(n+12+k,.09,.027,'square',w);if(revealed>points.length*.5&&!(i&3))tone(n+k,.12,.014,'triangle',w)}next+=step}}tick();bgmTimer=setInterval(tick,50)}

function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

function drawCleanScene(g){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd8f4');sky.addColorStop(.58,'#c8eafd');sky.addColorStop(1,'#ecf7ff');g.fillStyle=sky;g.fillRect(0,0,W,H);let sx=SW*.82-CX,sy=H*.18,rg=g.createRadialGradient(sx,sy,0,sx,sy,150);rg.addColorStop(0,'rgba(255,249,206,.72)');rg.addColorStop(1,'rgba(255,249,206,0)');g.fillStyle=rg;g.beginPath();g.arc(sx,sy,150,0,7);g.fill();if(stage===1)ground(g,'#d9efda',H*.2);g.save();g.lineCap='round';g.lineJoin='round';for(let i=0;i<7;i++){let b=rainbowBand(stage,i,rainbow.band,worldSeed);g.strokeStyle=C[i];g.globalAlpha=.88;g.lineWidth=b.width;g.beginPath();for(let j=0;j<=72;j++){let u=j/72,p=rainbowPoint(stage,u,rainbow,b.offset);j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke()}g.restore()}
function drawDirtyBase(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c3c8d5');g.addColorStop(.56,'#cbd2dc');g.addColorStop(1,'#d8dfe3');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(148,155,171,.12)';x.fillRect(0,0,W,H);if(stage===1)ground(x,'#cbd8cf',H*.2)}
function unicorn(g,X,Y,S,F){g.save();g.translate(X,Y);g.scale(F*S,S);g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,12,7,0,0,7);g.ellipse(12,-6,6,5,0,0,7);g.fill();g.fillStyle='#f3a4b8';g.beginPath();g.moveTo(14,-10);g.lineTo(21,-18);g.lineTo(18,-8);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-7,5);g.lineTo(-9,14);g.moveTo(6,5);g.lineTo(7,14);g.stroke();g.strokeStyle='#d4afe4';g.beginPath();g.moveTo(-10,-2);g.quadraticCurveTo(-20,-9,-18,3);g.stroke();g.fillStyle='#69648a';g.fillRect(14,-7,1,1);g.restore()}
function drawOverview(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd8f4');sky.addColorStop(.58,'#c8eafd');sky.addColorStop(1,'#ecf7ff');x.fillStyle=sky;x.fillRect(0,0,W,H);if(!history.length)return;const a=H/W;let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const h of history){minX=Math.min(minX,h.x);maxX=Math.max(maxX,h.x+1);minY=Math.min(minY,h.y*a);maxY=Math.max(maxY,(h.y+1)*a)}const pad=26,ww=maxX-minX,wh=maxY-minY,s=Math.min((W-pad*2)/ww,(H-pad*2)/wh),ox=(W-ww*s)/2-minX*s,oy=(H-wh*s)/2-minY*s;for(const h of history){x.save();x.beginPath();x.rect(ox+h.x*s,oy+h.y*a*s,s,a*s);x.clip();for(const q of h.c||[]){let cx=ox+(h.x+q[0])*s,cy=oy+(h.y*a+q[1]*a)*s,z=q[2]*s,d=q[3];parts(x,cx+z*.06,cy+z*.09,z,'rgba(93,101,122,'+(.10+.08*d)+')');parts(x,cx,cy,z,'rgba(245,246,249,'+(.26*(1-d))+')');parts(x,cx,cy,z,'rgba(154,161,178,'+(.78*d)+')')}x.restore()}x.save();x.lineCap='round';x.lineJoin='round';for(const h of history)for(let i=0;i<7;i++){let b=h.b[i];x.strokeStyle=C[i];x.globalAlpha=1;x.lineWidth=Math.max(.45,b.w*s);x.beginPath();for(let j=0;j<b.p.length;j++){let p=b.p[j],px=ox+(h.x+p[0])*s,py=oy+(h.y*a+p[1]*a)*s;j?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}x.restore();let h=history.at(-1),b=h.b[3],p=b.p.at(-1),q=b.p.at(-2),dx=p[0]-q[0],f=dx<0?-1:1;unicorn(x,ox+(h.x+p[0])*s,oy+(h.y*a+p[1]*a)*s,1.5,f)}
function drawRain(){x.strokeStyle='rgba(90,105,129,.20)';x.lineWidth=1.3;x.beginPath();for(const r of rain){x.moveTo(r.x,r.y);x.lineTo(r.x-3,r.y+r.l)}x.stroke()}
function parts(g,cx,cy,s,fill){const P=[[-.68,.14,.45],[-.43,-.13,.54],[-.12,-.30,.65],[.22,-.22,.58],[.53,.02,.49],[.08,.19,.80]];g.beginPath();for(const p of P){g.moveTo(cx+p[0]*s+p[2]*s,cy+p[1]*s);g.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,6.283)}g.fillStyle=fill;g.fill()}
function drawClouds(){for(const q of clouds){let ox=Math.sin(t*.55+q.p)*2,oy=Math.cos(t*.47+q.p)*1.2,cx=q.x+ox,cy=q.y+oy,s=q.s;parts(x,cx+4,cy+6,s,'rgba(93,101,122,'+(.10+.08*q.d)+')');parts(x,cx,cy,s,'rgba(245,246,249,'+(.26*(1-q.d))+')');parts(x,cx,cy,s,'rgba(154,161,178,'+(.78*q.d)+')')}}
function drawTutorialClouds(){for(const q of clouds.slice(0,6))parts(x,q.x,q.y,q.s,'rgba(255,255,255,.88)')}
function prepareStaticScene(){cleanCtx.clearRect(0,0,W,H);drawCleanScene(cleanCtx)}
function rebuildReveal(){revealCtx.clearRect(0,0,W,H);revealCtx.globalCompositeOperation='source-over';revealCtx.drawImage(cleanCanvas,0,0,W,H);revealCtx.globalCompositeOperation='destination-in';revealCtx.drawImage(maskCanvas,0,0,W,H);revealCtx.globalCompositeOperation='source-over'}
function cursor(){if(mouse.x<0||overview||transition||timeUp||(!running&&intro!==-1))return;let p=.5+.5*Math.sin(t*6),r=30+Math.sin(t*5)*1.5,i=16+p*2;x.save();x.fillStyle='rgba(93,101,122,.20)';x.beginPath();x.arc(mouse.x+2,mouse.y+3,r+8,0,7);x.fill();x.strokeStyle='rgba(93,101,122,.90)';x.lineWidth=4;x.beginPath();x.arc(mouse.x,mouse.y,r+2,0,7);x.stroke();let g=x.createRadialGradient(mouse.x,mouse.y,8,mouse.x,mouse.y,r+12);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(.55,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(mouse.x,mouse.y,r+12,0,7);x.fill();x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(mouse.x,mouse.y,i,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.98)';x.lineWidth=2.5;x.beginPath();x.arc(mouse.x,mouse.y,i,0,7);x.stroke();x.lineWidth=2;for(let k=-1;k<=1;k++){let y=mouse.y+k*8;x.beginPath();x.moveTo(mouse.x-11,y);x.quadraticCurveTo(mouse.x,y+3,mouse.x+11,y);x.stroke()}x.fillStyle='rgba(93,101,122,.92)';for(const a of [0,1.57,3.14,4.71]){x.beginPath();x.arc(mouse.x+Math.cos(a)*(r+2),mouse.y+Math.sin(a)*(r+2),2.2,0,7);x.fill()}x.restore()}
function drawIntro(){if(ready)return drawScene();drawCleanScene(x);let d=intro<0?0:Math.min(1,intro/3),u=intro<0?0:Math.min(.98,intro/2.2),b=rainbowBand(1,3,rainbow.band,worldSeed),p=rainbowPoint(1,u,rainbow,b.offset),q=rainbowPoint(1,Math.min(1,u+.01),rainbow,b.offset),f=q.x<p.x?-1:1;if(intro<0)drawTutorialClouds();unicorn(x,p.x,p.y-30*(1-u)-pet*12,2.2,f);if(d){x.save();x.globalAlpha=d;drawDirtyBase();drawRain();drawClouds();x.restore()}cursor()}
function update(dt,clock=dt){pet=Math.max(0,pet-clock*2.5);if(intro>=0){intro+=clock;if(intro>=3){intro=-2;ready=1;clearText.textContent='虹をたどって僕を見つけて！';nextBtn.textContent='GO';nextBtn.style.display='';clearDialog.classList.add('show')}}if(running&&!overview&&!goal&&!timeUp){timeLeft=Math.max(0,timeLeft-clock);showTime();if(timeLeft<=0){timeUp=1;running=0;c.style.cursor='auto';down=0;clearText.textContent='TIME UP!';nextBtn.style.display='none';resetBtn.textContent='Restart';resetBtn.style.display='';clearDialog.classList.add('show')}}if(overview)return;if(transition){transT=Math.min(1,transT+dt/.5);if(transT>=1)transition=0;return}t+=dt;let damp=Math.pow(.1,dt);for(const q of clouds){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=damp;q.vy*=damp}if(goalBlow){goalBlow+=clock;if(goalBlow>.9)clouds=[]}for(const r of rain){r.y+=r.v*dt;r.x-=15*dt;if(r.y>H+20){r.y=rnd(-100,-10);r.x=rnd(0,W)}}}
function drawScene(){if(goal){x.drawImage(cleanCanvas,0,0,W,H);let b=rainbowBand(stage,3,rainbow.band,worldSeed),p=rainbowPoint(stage,1,rainbow,b.offset),q=rainbowPoint(stage,.98,rainbow,b.offset);unicorn(x,p.x,Math.max(26,p.y-24),2.2,p.x<q.x?-1:1);drawClouds();cursor();return}drawDirtyBase();drawRain();x.drawImage(revealCanvas,0,0,W,H);if(stage===maxStage){let b=rainbowBand(stage,3,rainbow.band,worldSeed),p=rainbowPoint(stage,1,rainbow,b.offset),q=rainbowPoint(stage,.98,rainbow,b.offset);unicorn(x,p.x,Math.max(26,p.y-24),2.2,p.x<q.x?-1:1)}drawClouds();cursor()}
function drawTransition(){let p=1-Math.pow(1-transT,3),s=routeStep(transSide),ox=-s.x*W*p,oy=-s.y*H*p;x.clearRect(0,0,W,H);x.drawImage(fromCanvas,ox,oy,W,H);x.drawImage(toCanvas,ox+s.x*W,oy+s.y*H,W,H)}
function draw(){if(overview){drawOverview();return}if(transition){drawTransition();return}if(stage===1&&!running&&!goal&&!timeUp){drawIntro();return}drawScene()}
let prev=performance.now();function loop(n){let real=(n-prev)/1000,dt=Math.min(.033,real);prev=n;update(dt,real);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{startAudio();if((!running&&intro!==-1)||overview||transition||timeUp)return;let p=point(e);if(touchGoal(p))return;down=1;last=p;mouse=last;(intro===-1?tutorialScrub:scrub)(last,{x:last.x+1,y:last.y});c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{mouse=point(e);if(running||intro===-1)c.style.cursor='none';if(!down)return;let p=mouse;intro===-1?tutorialScrub(last,p):scrub(last,p);last=p});function up(e){down=0;last=null;try{c.releasePointerCapture(e.pointerId)}catch{}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',()=>{mouse={x:-99,y:-99};c.style.cursor='auto'});resetBtn.onclick=()=>{startAudio();if(timeUp){restartGame();return}if(intro===-1){startStage();intro=0;setRain(.006,.5);startHoof();resetBtn.style.display='none'}};nextBtn.onclick=()=>{startAudio();if(overview){nextGameStage();return}if(ready){ready=0;running=1;c.style.cursor='none';nextBtn.textContent='OK';clearText.textContent='もっと先にいるよ！';clearDialog.classList.remove('show')}else nextStage()};document.querySelector('#seedGo').onclick=()=>applySeed(seedInput.value);seedInput.addEventListener('keydown',e=>{if(e.key==='Enter')applySeed(seedInput.value)});addEventListener('resize',resize);seedInput.value=freshSeed();baseSeed=seedHash(seedInput.value);worldSeed=stageWorldSeed(1);seedText=seedInput.value;campaignLimit=seedStageLimit(baseSeed);maxStage=stageSectionCount(1);showTime();resize();restartGame();requestAnimationFrame(loop);
})();
