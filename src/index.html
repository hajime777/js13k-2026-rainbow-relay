<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rainbow Sky Cleaner Prototype v4.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Yu Gothic UI",sans-serif;background:#cfd6df;color:#5d6072}body{display:flex;align-items:center;justify-content:center}.game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:auto}.hud{position:absolute;left:10px;top:10px;pointer-events:none}.title{display:inline-block;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:999px;box-shadow:0 8px 24px rgba(85,98,130,.12);padding:6px 10px;font-size:15px;font-weight:800;color:#69648a;backdrop-filter:blur(5px)}.timer{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:999px;box-shadow:0 8px 24px rgba(85,98,130,.12);padding:6px 10px;font-size:14px;font-weight:800;color:#69648a;backdrop-filter:blur(5px);pointer-events:none}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}.clearDialog{display:none;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 8px 24px rgba(85,98,130,.13);padding:8px 10px;pointer-events:auto;backdrop-filter:blur(5px)}.clearDialog.show{display:flex}.clearText{font-size:12px;font-weight:800;color:#69648a}.seedbar,.controls{display:flex;align-items:center;gap:7px}.seedbar{pointer-events:auto;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.92);border-radius:999px;padding:5px 7px;box-shadow:0 6px 18px rgba(85,98,130,.09)}.seedbar span{font-size:10px;font-weight:800}.seedbar input{min-width:0;flex:1;border:0;outline:0;background:rgba(225,227,237,.68);border-radius:999px;padding:5px 8px;color:#5d6072;font-weight:700}.progress{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:999px;box-shadow:0 8px 24px rgba(85,98,130,.10);padding:7px 9px;backdrop-filter:blur(5px)}.meter{flex:1;height:7px;border-radius:99px;background:#e1e3ed;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#f5a3b8,#f8c398,#f5df93,#a9dca7,#9fd4ee,#b7b7ed,#d8b4e8);transition:width .12s}.pct{min-width:28px;text-align:right;font-size:10px;font-weight:800}.controls button,.clearDialog button,.seedbar button{pointer-events:auto;border:0;border-radius:999px;padding:8px 12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e9a8c2,#8ecae7);box-shadow:0 6px 18px rgba(94,162,195,.22);cursor:pointer}.seedbar button{padding:6px 10px}
</style>
</head>
<body>
<div id="game" class="game">
<canvas id="c"></canvas>
<div class="hud"><div class="title">Rainbow Sky Cleaner</div></div>
<div id="timer" class="timer">TIME 30.0</div>
<div class="bottom">
  <div id="clearDialog" class="clearDialog"><div id="clearText" class="clearText">僕が見つけた虹です</div><button id="next">OK</button></div>
  <div class="seedbar"><span>Seed</span><input id="seed" autocomplete="off" spellcheck="false"><button id="seedGo">Go</button></div>
  <div class="controls"><div class="progress"><div class="meter"><div id="fill" class="fill"></div></div><span id="pct" class="pct">0%</span></div><button id="reset">Start</button></div>
</div>
</div>
<script src="./logic.js"></script>
<script>
(()=>{
const {LEFT,RIGHT,BOTTOM,distancePointToSegment,revealPercent,isClearedPercent,markRevealPoints,seedHash,seedUnit,worldLength,oppositeSide,routeStep,firstExit,routeExit,rainbowPoint,rainbowBand}=RainbowLogic;
const c=document.querySelector('#c'),x=c.getContext('2d'),pct=document.querySelector('#pct'),fill=document.querySelector('#fill'),clearDialog=document.querySelector('#clearDialog'),clearText=document.querySelector('#clearText'),nextBtn=document.querySelector('#next'),seedInput=document.querySelector('#seed'),timer=document.querySelector('#timer'),resetBtn=document.querySelector('#reset');
const cleanCanvas=document.createElement('canvas'),cleanCtx=cleanCanvas.getContext('2d');
const maskCanvas=document.createElement('canvas'),maskCtx=maskCanvas.getContext('2d');
const revealCanvas=document.createElement('canvas'),revealCtx=revealCanvas.getContext('2d');
const fromCanvas=document.createElement('canvas'),fromCtx=fromCanvas.getContext('2d'),toCanvas=document.createElement('canvas'),toCtx=toCanvas.getContext('2d');
const C=['#f3a4b8','#f6bb91','#f1d97d','#a8d69f','#92cce8','#abaee8','#d4afe4'];
let W=0,H=0,D=1,SW=0,CX=0,cropSide=1,clouds=[],rain=[],down=0,last=null,t=0,mouse={x:-99,y:-99},revealed=0,points=[],rainbow=null,cleared=0,stage=1,mapX=0,mapY=0,entrySide=BOTTOM,exitSide=RIGHT,history=[],overview=0,transition=0,transT=0,transSide=RIGHT,seedText='',worldSeed=1,maxStage=4,randSeq=0,uni=-1,timeLeft=30,timeUp=0,goal=0,running=0;
const rnd=(a,b)=>a+seedUnit(worldSeed,stage,randSeq++,mapX*97+mapY*193)*(b-a);
function freshSeed(){let q=globalThis.crypto;return String(q?.getRandomValues?q.getRandomValues(new Uint32Array(1))[0]:Date.now()>>>0)}
function showTime(){timer.textContent='TIME '+timeLeft.toFixed(1)}
function resize(){let w=c.clientWidth,h=c.clientHeight,d=Math.min(1.5,devicePixelRatio||1),ow=W,oh=H,m,hits;if(ow&&w===ow&&h===oh)return;if(ow&&!overview){m=document.createElement('canvas');m.width=maskCanvas.width;m.height=maskCanvas.height;m.getContext('2d').drawImage(maskCanvas,0,0);hits=points.map(p=>p.hit)}D=d;W=w;H=h;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);for(const q of [cleanCanvas,maskCanvas,revealCanvas]){q.width=Math.floor(W*D);q.height=Math.floor(H*D)}for(const q of [fromCanvas,toCanvas]){q.width=c.width;q.height=c.height}cleanCtx.setTransform(D,0,0,D,0,0);maskCtx.setTransform(D,0,0,D,0,0);revealCtx.setTransform(D,0,0,D,0,0);transition=0;if(!ow)return startStage();if(overview)return drawOverview();let sx=W/ow,sy=H/oh;for(const q of clouds){q.x*=sx;q.y*=sy;q.s*=sx;q.vx*=sx;q.vy*=sy}for(const r of rain){r.x*=sx;r.y*=sy;r.l*=sy;r.v*=sy}if(mouse.x>=0){mouse.x*=sx;mouse.y*=sy}down=0;last=null;SW=H*16/9;CX=cropSide<0?0:Math.max(0,SW-W);buildRainbowPoints();if(hits){for(let i=0;i<Math.min(hits.length,points.length);i++)points[i].hit=hits[i];revealed=points.reduce((n,p)=>n+p.hit,0)}prepareStaticScene();if(m)maskCtx.drawImage(m,0,0,m.width,m.height,0,0,W,H);rebuildReveal();updateMeter()}
function applySeed(v){seedText=String(v).trim()||freshSeed();seedInput.value=seedText;worldSeed=seedHash(seedText);maxStage=worldLength(worldSeed);restartGame()}
function restartGame(){stage=1;mapX=0;mapY=0;history=[];overview=0;transition=0;transT=0;uni=-1;timeLeft=30;timeUp=0;goal=0;running=0;c.style.cursor='auto';showTime();resetBtn.textContent='Start';resetBtn.style.display='';entrySide=BOTTOM;exitSide=firstExit(worldSeed);nextBtn.style.display='';clearText.textContent='僕が見つけた虹です';startStage()}
function startStage(){clouds=[];rain=[];revealed=0;down=0;last=null;mouse={x:-99,y:-99};cleared=0;randSeq=0;uni=-1;cropSide=rnd(0,1)<.5?-1:1;SW=H*16/9;CX=cropSide<0?0:Math.max(0,SW-W);clearDialog.classList.remove('show');nextBtn.style.display='';clearText.textContent='僕が見つけた虹です';maskCtx.save();maskCtx.setTransform(1,0,0,1,0,0);maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);maskCtx.restore();
 const cols=Math.max(6,Math.floor(W/105)),rows=Math.max(5,Math.floor(H/135));
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let cx=(i+.5)*W/cols+rnd(-45,45),cy=115+(j+.45)*(H*.64-70)/rows+rnd(-28,28),s=rnd(38,64);clouds.push({x:cx,y:cy,s,d:1,p:rnd(0,6.28),vx:0,vy:0});if(rnd(0,1)<.68)clouds.push({x:cx+rnd(-55,55),y:cy+rnd(-20,20),s:s*rnd(.62,.84),d:1,p:rnd(0,6.28),vx:0,vy:0})}
 for(let i=0;i<Math.max(40,W*H/22000);i++)rain.push({x:rnd(0,W),y:rnd(0,H),l:rnd(7,15),v:rnd(110,210)});
 buildRainbowPoints();prepareStaticScene();rebuildReveal();updateMeter()}
function buildRainbowPoints(){points=[];rainbow={w:W,h:H,entry:entrySide,exit:exitSide,band:Math.max(8,Math.min(14,W/28)),seed:worldSeed};
 const count=96,mid=rainbowBand(stage,3,rainbow.band,worldSeed);
 for(let i=0;i<count;i++){let u=i/(count-1),p=rainbowPoint(stage,u,rainbow,mid.offset);if(p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H)points.push({x:p.x,y:p.y,hit:0})}
}
function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scrub(a,b){if(!running||overview||transition||timeUp)return;let dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)return;let nx=dx/L,ny=dy/L;
 maskCtx.save();maskCtx.lineCap='round';maskCtx.lineJoin='round';
 maskCtx.strokeStyle='rgba(255,255,255,.20)';maskCtx.lineWidth=98;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();
 maskCtx.strokeStyle='rgba(255,255,255,.62)';maskCtx.lineWidth=78;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();
 maskCtx.strokeStyle='#fff';maskCtx.lineWidth=54;maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();maskCtx.restore();
 for(const q of clouds){let d=distancePointToSegment(q.x,q.y,a,b),r=q.s+44;if(d<r){let f=1-d/r,push=Math.min(190,55+L*5)*f;q.d=Math.max(.18,q.d-(.02+f*.05));q.vx=Math.max(-260,Math.min(260,q.vx+nx*push));q.vy=Math.max(-260,Math.min(260,q.vy+ny*push))}}
 revealed+=markRevealPoints(points,a,b,52);rebuildReveal();updateMeter()}
function updateMeter(){let p=revealPercent(revealed,points.length);pct.textContent=p+'%';fill.style.width=p+'%';if(isClearedPercent(p)&&!cleared){cleared=1;if(stage===1)uni=0;if(stage===maxStage){goal=1;running=0;c.style.cursor='auto';clearText.textContent='GOAL!';resetBtn.textContent='Restart';resetBtn.style.display=''}clearDialog.classList.add('show')}}
function captureStage(){let bands=[],cs=[];for(let i=0;i<7;i++){let b=rainbowBand(stage,i,rainbow.band,worldSeed),ps=[];for(let j=0;j<=72;j++){let p=rainbowPoint(stage,j/72,rainbow,b.offset);ps.push([p.x/W,p.y/H])}bands.push({w:b.width/W,p:ps})}for(const q of clouds)if(q.x+q.s*1.4>0&&q.x-q.s*1.4<W&&q.y+q.s*1.2>0&&q.y-q.s*1.2<H)cs.push([q.x/W,q.y/H,q.s/W,q.d]);history[stage-1]={x:mapX,y:mapY,b:bands,c:cs}}
function snapFrame(q,g){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,q.width,q.height);g.drawImage(c,0,0)}
function nextStage(){if(timeUp)return;captureStage();if(stage>=maxStage){showOverview();return}transSide=exitSide;drawScene();snapFrame(fromCanvas,fromCtx);let s=routeStep(exitSide);mapX+=s.x;mapY+=s.y;entrySide=oppositeSide(exitSide);stage++;exitSide=stage===maxStage?-1:routeExit(worldSeed,stage,entrySide,mapX,mapY);startStage();drawScene();snapFrame(toCanvas,toCtx);transition=1;transT=0}
function showOverview(){overview=1;down=0;last=null;clearText.textContent=maxStage+'つの空で見つけた虹です';nextBtn.style.display='none';clearDialog.classList.add('show');pct.textContent=maxStage+'/'+maxStage;fill.style.width='100%';drawOverview()}
function drawCleanScene(g){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd8f4');sky.addColorStop(.58,'#c8eafd');sky.addColorStop(1,'#ecf7ff');g.fillStyle=sky;g.fillRect(0,0,W,H);
 let sx=SW*.82-CX,sy=H*.18,rg=g.createRadialGradient(sx,sy,0,sx,sy,150);rg.addColorStop(0,'rgba(255,249,206,.72)');rg.addColorStop(1,'rgba(255,249,206,0)');g.fillStyle=rg;g.beginPath();g.arc(sx,sy,150,0,7);g.fill();
 g.save();g.lineCap='round';g.lineJoin='round';for(let i=0;i<7;i++){let b=rainbowBand(stage,i,rainbow.band,worldSeed);g.strokeStyle=C[i];g.globalAlpha=.88;g.lineWidth=b.width;g.beginPath();for(let j=0;j<=72;j++){let p=rainbowPoint(stage,j/72,rainbow,b.offset);j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke()}g.restore();
 g.save();g.translate(-CX,0);g.fillStyle='#d9efda';g.beginPath();g.moveTo(0,H);g.bezierCurveTo(SW*.17,H*.80,SW*.35,H*.91,SW*.52,H*.84);g.bezierCurveTo(SW*.73,H*.72,SW*.88,H*.92,SW,H*.82);g.lineTo(SW,H);g.fill();g.restore()}
function drawDirtyBase(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c3c8d5');g.addColorStop(.56,'#cbd2dc');g.addColorStop(1,'#d8dfe3');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(148,155,171,.12)';x.fillRect(0,0,W,H);
 x.save();x.translate(-CX,0);x.fillStyle='#cbd8cf';x.beginPath();x.moveTo(0,H);x.bezierCurveTo(SW*.17,H*.80,SW*.35,H*.91,SW*.52,H*.84);x.bezierCurveTo(SW*.73,H*.72,SW*.88,H*.92,SW,H*.82);x.lineTo(SW,H);x.fill();x.restore()}
function unicorn(g,X,Y,S,F){g.save();g.translate(X,Y);g.scale(F*S,S);g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,12,7,0,0,7);g.ellipse(12,-6,6,5,0,0,7);g.fill();g.fillStyle='#f3a4b8';g.beginPath();g.moveTo(14,-10);g.lineTo(21,-18);g.lineTo(18,-8);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-7,5);g.lineTo(-9,14);g.moveTo(6,5);g.lineTo(7,14);g.stroke();g.strokeStyle='#d4afe4';g.beginPath();g.moveTo(-10,-2);g.quadraticCurveTo(-20,-9,-18,3);g.stroke();g.fillStyle='#69648a';g.fillRect(14,-7,1,1);g.restore()}
function drawOverview(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd8f4');sky.addColorStop(.58,'#c8eafd');sky.addColorStop(1,'#ecf7ff');x.fillStyle=sky;x.fillRect(0,0,W,H);if(!history.length)return;
 const a=H/W;let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const h of history){minX=Math.min(minX,h.x);maxX=Math.max(maxX,h.x+1);minY=Math.min(minY,h.y*a);maxY=Math.max(maxY,(h.y+1)*a)}
 const pad=26,ww=maxX-minX,wh=maxY-minY,s=Math.min((W-pad*2)/ww,(H-pad*2)/wh),ox=(W-ww*s)/2-minX*s,oy=(H-wh*s)/2-minY*s;
 for(const h of history){x.save();x.beginPath();x.rect(ox+h.x*s,oy+h.y*a*s,s,a*s);x.clip();for(const q of h.c||[]){let cx=ox+(h.x+q[0])*s,cy=oy+(h.y*a+q[1]*a)*s,z=q[2]*s,d=q[3];parts(x,cx+z*.06,cy+z*.09,z,'rgba(93,101,122,'+(.10+.08*d)+')');parts(x,cx,cy,z,'rgba(245,246,249,'+(.26*(1-d))+')');parts(x,cx,cy,z,'rgba(154,161,178,'+(.78*d)+')')}x.restore()}x.save();x.lineCap='round';x.lineJoin='round';for(const h of history)for(let i=0;i<7;i++){let b=h.b[i];x.strokeStyle=C[i];x.globalAlpha=1;x.lineWidth=Math.max(.45,b.w*s);x.beginPath();for(let j=0;j<b.p.length;j++){let p=b.p[j],px=ox+(h.x+p[0])*s,py=oy+(h.y*a+p[1]*a)*s;j?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}x.restore();let h=history.at(-1),b=h.b[3],p=b.p.at(-1),q=b.p.at(-2),dx=p[0]-q[0],f=dx<0?-1:1;unicorn(x,ox+(h.x+p[0])*s,oy+(h.y*a+p[1]*a)*s,1.5,f)}
function drawRain(){x.strokeStyle='rgba(90,105,129,.20)';x.lineWidth=1.3;x.beginPath();for(const r of rain){x.moveTo(r.x,r.y);x.lineTo(r.x-3,r.y+r.l)}x.stroke()}
function parts(g,cx,cy,s,fill){const P=[[-.68,.14,.45],[-.43,-.13,.54],[-.12,-.30,.65],[.22,-.22,.58],[.53,.02,.49],[.08,.19,.80]];g.beginPath();for(const p of P){g.moveTo(cx+p[0]*s+p[2]*s,cy+p[1]*s);g.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,6.283)}g.fillStyle=fill;g.fill()}
function drawClouds(){for(const q of clouds){let ox=Math.sin(t*.55+q.p)*2,oy=Math.cos(t*.47+q.p)*1.2,cx=q.x+ox,cy=q.y+oy,s=q.s;parts(x,cx+4,cy+6,s,'rgba(93,101,122,'+(.10+.08*q.d)+')');parts(x,cx,cy,s,'rgba(245,246,249,'+(.26*(1-q.d))+')');parts(x,cx,cy,s,'rgba(154,161,178,'+(.78*q.d)+')')}}
function prepareStaticScene(){cleanCtx.clearRect(0,0,W,H);drawCleanScene(cleanCtx)}
function rebuildReveal(){revealCtx.clearRect(0,0,W,H);revealCtx.globalCompositeOperation='source-over';revealCtx.drawImage(cleanCanvas,0,0,W,H);revealCtx.globalCompositeOperation='destination-in';revealCtx.drawImage(maskCanvas,0,0,W,H);revealCtx.globalCompositeOperation='source-over'}
function cursor(){if(!running||mouse.x<0||overview)return;x.save();x.strokeStyle='rgba(255,255,255,.72)';x.lineWidth=2;x.setLineDash([4,5]);x.beginPath();x.arc(mouse.x,mouse.y,28,0,7);x.stroke();x.restore()}
function update(dt,clock=dt){if(running&&!overview&&!goal&&!timeUp){timeLeft=Math.max(0,timeLeft-clock);showTime();if(timeLeft<=0){timeUp=1;running=0;c.style.cursor='auto';down=0;clearText.textContent='TIME UP!';nextBtn.style.display='none';resetBtn.textContent='Restart';resetBtn.style.display='';clearDialog.classList.add('show')}}if(overview)return;if(transition){transT=Math.min(1,transT+dt/.5);if(transT>=1)transition=0;return}t+=dt;if(uni>=0)uni+=dt;let damp=Math.pow(.1,dt);for(const q of clouds){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=damp;q.vy*=damp}for(const r of rain){r.y+=r.v*dt;r.x-=15*dt;if(r.y>H+20){r.y=rnd(-100,-10);r.x=rnd(0,W)}}}
function drawScene(){drawDirtyBase();drawRain();x.drawImage(revealCanvas,0,0,W,H);drawClouds();if(stage===1&&uni>=0&&uni<1.5){let u=Math.min(.98,uni/1.2),b=rainbowBand(1,3,rainbow.band,worldSeed),p=rainbowPoint(1,u,rainbow,b.offset),q=rainbowPoint(1,Math.min(1,u+.01),rainbow,b.offset),dx=q.x-p.x,f=dx<0?-1:1;unicorn(x,p.x,p.y,2.2,f)}cursor()}
function drawTransition(){let p=1-Math.pow(1-transT,3),s=routeStep(transSide),ox=-s.x*W*p,oy=-s.y*H*p;x.clearRect(0,0,W,H);x.drawImage(fromCanvas,ox,oy,W,H);x.drawImage(toCanvas,ox+s.x*W,oy+s.y*H,W,H)}
function draw(){if(overview){drawOverview();return}if(transition){drawTransition();return}drawScene()}
let prev=performance.now();function loop(n){let real=(n-prev)/1000,dt=Math.min(.033,real);prev=n;update(dt,real);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(!running||overview||transition||timeUp)return;down=1;last=point(e);mouse=last;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{mouse=point(e);if(!down)return;let p=mouse;scrub(last,p);last=p});function up(e){down=0;last=null;try{c.releasePointerCapture(e.pointerId)}catch{}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',()=>mouse={x:-99,y:-99});resetBtn.onclick=()=>{if(timeUp||goal||overview)restartGame();running=1;c.style.cursor='none';resetBtn.style.display='none'};nextBtn.onclick=nextStage;document.querySelector('#seedGo').onclick=()=>applySeed(seedInput.value);seedInput.addEventListener('keydown',e=>{if(e.key==='Enter')applySeed(seedInput.value)});addEventListener('resize',resize);seedInput.value=freshSeed();worldSeed=seedHash(seedInput.value);seedText=seedInput.value;maxStage=worldLength(worldSeed);showTime();resize();restartGame();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
